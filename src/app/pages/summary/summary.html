<section class="summary-wrapper">
  <div class="summary-headline">
    <h1 class="summary-title">Join 360</h1>
    <span class="summary-separator"></span>
    <p class="summary-subtitle">Key Metrics at a Glance</p>
  </div>

  <!-- NUR PLATZHALTE -->

  <div class="summary-metrics">
    <div class="summary-metrics-firstLine">
      <div class="summary-metrics-toDo">
        <span> {{ todoTasks }}</span>
      </div>
      <div class="summary-metrics-done">
        {{ doneTasks }}
      </div>
    </div>
    <div class="summary-metrics-secondLine">
      <span class="summary-metrics-urgent">
        {{ urgentTasks }}
      </span>
      <span class="summary-metrics-date">
        <p>{{ currentDate | date: 'dd.MM.yyyy' }}</p>
      </span>
    </div>
    <div class="summary-metrics-thirdLine">
      <div class="summary-metrics-taskBoard">
        <span>{{ tasksInBoard }}</span>
      </div>
      <div class="summary-metrics-taskInProgress"></div>
      <div class="summary-metrics-awaitFeedback"></div>
    </div>
  </div>

  <div class="greeting">
    <h2>Good morning!</h2>

    @if (firstName) {
      <p>{{ firstName }}</p>
    }
  </div>
</section>
