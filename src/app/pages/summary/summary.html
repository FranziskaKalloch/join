<section class="summary">
  <div class="summary__headline">
    <h1 class="summary__title">Join 360</h1>
    <span class="summary__separator"></span>
    <p class="summary__subtitle">Key Metrics at a Glance</p>
  </div>

  <!-- NUR PLATZHALTE -->

  <div class="summary__metrics">
    <div class="summary__metrics-firstLine">
      <div class="summary__metrics-toDo">
        <span> {{ todoTasks }}</span>
      </div>
      <div class="summary__metrics-done">
        {{ doneTasks }}
      </div>
    </div>
    <div class="summary__metrics-secondLine">
      <span class="summary__metrics-urgent">
        {{ urgentTasks }}
      </span>
      <span class="summary__metrics-date">
        <p>{{ currentDate | date: 'dd.MM.yyyy' }}</p>
      </span>
    </div>
    <div class="summary__metrics-thirdLine">
      <div class="summary__metrics-taskBoard">
        <span>{{ tasksInBoard }}</span>
      </div>
      <div class="summary__metrics-taskInProgress"></div>
      <div class="summary__metrics-awaitFeedback"></div>
    </div>
  </div>

  <div class="greeting">
    <h2>Good morning!</h2>

    @if (firstName) {
      <p>{{ firstName }}</p>
    }
  </div>
</section>
