<section id="wrapper-join-login">
    <div class="layout-login">
        <section class="wrapper-header-login">
            <div class="logo-login">
                <img class="img-logo-login" src="/assets/img/logo/logo-join.svg" />
            </div>
            <div class="header-right-login">
                <div class="header-right-login-text">Not a Join user?</div>
                <div class="header-right-sign-up"><button class="btn-primary btn-primary--signup" type="button">Sign
                        up</button></div>
            </div>
        </section>
        <main class="main-login">
            <section class="wrapper-content-login">
                <h1 class="headline-login">Log in</h1>
                <div class="headline-stroke"></div>
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                    <div class="form-scroll">
                        <div class="form-cell">
                            <input id="email" class="input-mail" type="text" name="email" formControlName="email"
                                placeholder="Email" />
                            <div class="form-error-placeholder"></div>
                        </div>
                        <div class="form-cell">
                            <input id="password" class="input-password" type="text" name="password"
                                formControlName="password" placeholder="Password" />
                            <div class="form-error-placeholder"></div>
                        </div>
                        <div class="login-buttons">
                            <button class="btn-primary btn-primary--login" type="button">
                                Log in
                            </button>
                            <button class="btn-primary btn-primary--guest" type="button">
                                Guest Log in
                            </button>
                        </div>
                    </div>
                </form>
            </section>
        </main>
        <section class="wrapper-footer-login">
            <div class="login-legal">

            </div>
        </section>
    </div>
</section>
